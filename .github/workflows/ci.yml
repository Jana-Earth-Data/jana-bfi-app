# ============================================================================
# Continuous Integration — jana-bfi-app
# ============================================================================
# Task P0.1 of PROJECT_PLAN.md. This is the gate that makes every later
# hardening phase enforceable: nothing merges that fails lint, type-check, the
# build guards, or the real Docker image build.
#
# WHY EVERYTHING RUNS IN A CONTAINER
# ----------------------------------
# This project has no local Node toolchain policy — all testing happens in
# Docker. CI mirrors that exactly:
#   * The `checks` job runs inside `node:20-alpine`, the SAME image the
#     production Dockerfile builds from, so lint / type-check / guards run
#     against the Node version we actually ship on — not whatever a bare
#     GitHub runner happens to provide.
#   * The `docker-build` job builds the REAL production image. P5.8: ONE build
#     that always includes the demo capability. The prebuild guards
#     unconditionally generate the precomputed portfolio; JANA_DEMO is
#     runtime-only and controls whether the demo switch is offered to users.
#     This proves the exact artifact that deploys actually compiles.
#
# The `checks` job runs the Vitest suite (report-only coverage, no gate) as of
# P0.4. The coverage THRESHOLD gate on lib/regulatory/** is turned on later in
# P1.5 — see PROJECT_PLAN.md P0.2–P0.4 and P1.5.
# ============================================================================

name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Static checks: lint, type-check, and the build-time guards.
  # Runs inside node:20-alpine to match the production image's Node version.
  # --------------------------------------------------------------------------
  checks:
    name: Lint, type-check & guards
    runs-on: ubuntu-latest
    container:
      image: node:20-alpine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install exactly what the lockfile pins — no silent version drift.
      # As of P0.6, every top-level dependency is an EXACT version in
      # package.json (no caret ranges), so `npm ci` and a stray local
      # `npm install` resolve to the same tree.
      - name: Install dependencies
        run: npm ci

      # P0.6: fail the build on a known HIGH or CRITICAL advisory in the
      # dependency tree. --audit-level=high is deliberate: the tree currently
      # carries two MODERATE advisories (transitive uuid via exceljs, whose only
      # fix is a breaking exceljs@3.x downgrade), which must not block merges.
      # A high/critical advisory is action-required and does fail here.
      - name: Dependency audit (high+)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      # Vitest suite with v8 coverage. Report-only: `vitest.config.mts` sets NO
      # coverage threshold yet, so a low-coverage run cannot fail the build (the
      # gate on lib/regulatory/** arrives in P1.5). This step exists now (P0.4)
      # so the harness — and, as they land, the PR0 characterization goldens —
      # run on every push against the exact Node version we ship on.
      - name: Test (report-only coverage)
        run: npm run test:coverage

      # The 8 prebuild guards (check-dockerignore-build-scripts, check-build-
      # wiring, check-demo-imports, check-demo-mode-gate, check-docker-demo-
      # flag, check-capture-client, check-demo-officers, check-regulatory-
      # boundary) plus precompute-guard. Run them directly rather than via
      # `next build` so a guard failure is attributed clearly and doesn't
      # require a full build first.
      #
      # P5.8: precompute-guard ALWAYS generates the portfolio (no conditional
      # logic). JANA_DEMO is runtime-only and not used during build.
      - name: Build guards (prebuild)
        run: npm run prebuild

      # NOTE: the provenance guard (`npm run check:provenance` →
      # check-seeded-rows.mjs) is deliberately NOT a CI step. It is an
      # operational tool, not a build gate: it instantiates a live Supabase
      # client and reads NEXT_PUBLIC_SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY
      # to COUNT demo-tagged rows in the real project. Wiring it into CI would
      # require putting production Supabase secrets into the workflow, and it
      # cannot run without them. (It also currently requires Node ≥ 22 because
      # @supabase/realtime-js needs native WebSocket, which node:20-alpine
      # lacks.) It is run by hand against a real environment — see the script
      # header. CI proves the build compiles; provenance is a human decision.

  # --------------------------------------------------------------------------
  # Build the real production image. P5.8: ONE build that always includes the
  # demo capability. The prebuild guards unconditionally generate the
  # precomputed 80,035-loan portfolio. JANA_DEMO is a runtime ENV (set in the
  # Dockerfile runner stage) that controls whether the demo switch is offered
  # to users; it is not a build arg anymore. This is the "test in Docker"
  # signal: the exact artifact that ships must build.
  # --------------------------------------------------------------------------
  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # P5.8: Single build. The demo code and precomputed portfolio are in
      # every image; JANA_DEMO (runtime ENV) gates the Demo menu and the
      # /api/demo/mode toggle route.
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=build
          cache-to: type=gha,mode=max,scope=build
          tags: jana-bfi-app:ci
